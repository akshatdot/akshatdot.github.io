<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Akshat Verma - Internship Gallery</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      background-color: #ffffff;
      color: #000000;
      max-width: 800px; /* Changed from 850px to match resume.html exactly */
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h3 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 10px;
      font-weight: bold;
    }
    p {
      margin-top: 5px;
      margin-bottom: 15px;
    }
    a {
      color: #0000EE;
    }
    a:visited {
      color: #551A8B;
    }
    
    .gallery-item {
      display: flex;
      gap: 30px;
      margin-bottom: 35px;
      align-items: centre;
    }
    .gallery-item img {
      flex-shrink: 0;
      max-width: 400px;
      width: 100%;
      border: 1px solid #999;
      padding: 3px;
      background-color: #fff;
    }
    .gallery-text {
      flex: 1;
      text-align: centre;
    }

    @media (max-width: 600px) {
      .gallery-item {
        flex-direction: column;
        gap: 15px;
      }
      .gallery-item img {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>


<div style="text-align: center; margin-bottom: 20px;">
  
  <img src="images/gallery.jpg" alt="Gallery Icon" width="70">
  
</div>

<hr>


<div class="gallery-item">
  <div class="gallery-image">

    <img src="images/metals.webp" alt="gif">
  </div>
  <div class="gallery-text">
    <p> - trying to understand how these exotic pieces of metals work</p>

  </div>
</div>

<hr>

  
<div class="gallery-item">
  <div class="gallery-image">

    <img src="images/cam.jpg" alt="robotic eye">
  </div>
  <div class="gallery-text">
    <p>computer - vision, quite literally</p>

  </div>
</div>

<hr>

<div class="gallery-item">
  <div class="gallery-image">

    <img src="images/debug.webp" alt="gif">
  </div>
  <div class="gallery-text">
    <p>and follows lots of debugging</p>

  </div>
</div>

<hr>

<div class="gallery-item">
  <div class="gallery-image">

    <img src="images/itworked.jpg" alt="it finally worked">
  </div>
  <div class="gallery-text">
    <p>but it finally worked!</p>

  </div>
</div>

<hr>


<div class="gallery-item">
  <div class="gallery-image">

    <img src="images/ui.jpg" alt="ui image">
  </div>
  <div class="gallery-text">
    <p>teesting of the ui</p>

  </div>
</div>

<hr>


<div class="gallery-item">
  <div class="gallery-image">

    <img src="images/network.jpg" alt="network settings">
  </div>
  <div class="gallery-text">
    <p>i never before played around networks settings. it was a lot of fun.</p>

  </div>
</div>

<hr>




<p style="text-align: center; margin-top: 40px;">
  <a href="resume.html">&larr; Back to Resume</a>
</p>

</body>
</html>
